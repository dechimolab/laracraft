<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="15" fill="#ff5542"/>
  <!-- Isometric 3D Cube (deployed_code) -->
  <g stroke="#0b1326" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- Top Face -->
    <polygon points="32,16 48,25 32,34 16,25" fill="rgba(255,255,255,0.18)"/>
    <!-- Left Face -->
    <polygon points="16,25 32,34 32,49 16,40" fill="rgba(0,0,0,0.18)"/>
    <!-- Right Face -->
    <polygon points="48,25 32,34 32,49 48,40" fill="rgba(0,0,0,0.06)"/>
  </g>
</svg>